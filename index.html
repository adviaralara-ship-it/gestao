    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "94fc5c63-540e-479f-8866-ecc43fc7915c",
          });
          console.log("OneSignal inicializado com sucesso.");
        } catch (e) {
          console.error("Erro no OneSignal init:", e);
        }
      });
    </script>

    <script>
      // Captura segura de erros para log sem travar a interface do usuário
      window.addEventListener('error', function(e) {
        console.warn('App error handled:', e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Promise rejection handled:', e.reason);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
